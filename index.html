<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; padding:0; background:transparent; height:100%; overflow:hidden; font-family:sans-serif; }
    .modal-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 12px; width: 85%; max-width: 360px;
      text-align: center; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .close-btn { position: absolute; top: 8px; right: 12px; font-size: 24px; border: none; background: none; cursor: pointer; color: #888; }
    .info-box { background: #f7f7f7; padding: 12px; margin-top: 12px; border-radius: 6px; text-align: left; font-size: 13px; line-height: 1.6; color: #333; }
  </style>
</head>
<body>
  <div class="modal-bg" id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h3 style="margin:0 0 10px; font-size:18px; color:#222;">ホーム画面に追加</h3>
      <p style="font-size:13px; color:#555; margin:0;">このサイトをホーム画面に追加すると、次回からアプリ感覚でサクサク開けます！</p>
      <div class="info-box">
        <p style="margin:0 0 8px;"><b>【iPhone (Safari)】</b><br>画面下部の「共有ボタン（□↑）」をタップし、「ホーム画面に追加」を選択</p>
        <p style="margin:0;"><b>【Android】</b><br>ブラウザ右上のメニュー（︙）から「ホーム画面に追加」を選択</p>
      </div>
    </div>
  </div>
  <script>
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
