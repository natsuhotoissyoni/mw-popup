<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; height: 100%; font-family: sans-serif; overflow: hidden; }
    
    /* 右下に寄せる配置 */
    .wrapper {
      width: 100%; height: 100%; padding: 10px;
      display: flex; justify-content: flex-end; align-items: flex-end;
    }
    
    /* 最初に見える追従ボタン */
    .start-btn {
      background: #222; color: #fff; border: none; padding: 12px 18px;
      border-radius: 25px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s; white-space: nowrap;
    }
    .start-btn:hover { background: #444; }

    /* 開く案内カード */
    .card {
      display: none; background: #fff; border: 1px solid #eee; border-radius: 12px;
      padding: 16px; width: 100%; height: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative; text-align: left; flex-direction: column; justify-content: center;
    }
    .card.active { display: flex; }
    .close-btn { position: absolute; top: 6px; right: 10px; font-size: 20px; border: none; background: none; cursor: pointer; color: #aaa; }
    
    /* OS別判定テキスト */
    .os-text { display: none; background: #f7f7f7; padding: 10px; border-radius: 6px; font-size: 12px; line-height: 1.5; color: #333; margin-top: 8px; }
    .os-text.active { display: block; }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- 最初に見える右下ボタン -->
    <button id="start-btn" class="start-btn" onclick="openCard()">📱 ホーム画面に追加</button>

    <!-- ボタンを押すと現れるカード -->
    <div id="card" class="card">
      <button class="close-btn" onclick="closeCard()">&times;</button>
      <h3 style="margin: 0 0 4px 0; font-size: 15px; color: #222;">ホーム画面に追加</h3>
      <p style="font-size: 11px; color: #666; margin: 0;">次回からアプリ感覚で開けます！</p>

      <div id="ios-text" class="os-text">
        <p style="margin:0;"><b>【iPhone (Safari)】</b><br>下部の「共有ボタン（□↑）」→「ホーム画面に追加」</p>
      </div>
      <div id="android-text" class="os-text">
        <p style="margin:0;"><b>【Android (Chrome)】</b><br>右上のメニュー（︙）→「ホーム画面に追加」</p>
      </div>
      <div id="other-text" class="os-text">
        <p style="margin:0;">ブラウザメニューから「ホーム画面に追加」を選択してください。</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var ua = navigator.userAgent;
      var os = 'other';
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) { os = 'ios'; }
      else if (/Android/.test(ua)) { os = 'android'; }
      document.getElementById(os + '-text').classList.add('active');
    });

    function openCard() {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('card').classList.add('active');
    }
    function closeCard() {
      document.getElementById('card').classList.remove('active');
      document.getElementById('start-btn').style.display = 'inline-block';
    }
  </script>
</body>
</html>
